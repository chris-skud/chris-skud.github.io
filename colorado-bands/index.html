<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colorado Bands</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/1e86da1209.js"
      crossorigin="anonymous"
    ></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        background: #0a0a0a;
        color: #d0d0d0;
        padding: 1.5rem 1rem;
        line-height: 1.4;
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
      }

      h1 {
        font-family: "JetBrains Mono", monospace;
        text-align: center;
        margin-bottom: 1rem;
        font-size: 1.75rem;
        font-weight: 400;
        color: #e0e0e0;
        letter-spacing: 0.05em;
        text-transform: lowercase;
      }

      .filters {
        display: flex;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      .filters input {
        font-size: 14px;
        font-family: "Inter", sans-serif;
        padding: 0.5rem 0.75rem;
        border: 1px solid #2a2a2a;
        border-radius: 3px;
        min-width: 180px;
        background: #1a1a1a;
        color: #d0d0d0;
        transition: all 0.2s ease;
      }

      .filters input:focus {
        outline: none;
        border-color: #4a4a4a;
        background: #1f1f1f;
      }

      .filters input::placeholder {
        color: #5a5a5a;
      }

      #band-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 0.75rem;
      }

      .band {
        background: #141414;
        border: 1px solid #252525;
        border-radius: 4px;
        padding: 0.875rem;
        transition: all 0.2s ease;
      }

      .band:hover {
        border-color: #3a3a3a;
        background: #181818;
      }

      .band h2 {
        margin: 0 0 0.4rem;
        font-size: 1rem;
        font-weight: 500;
        color: #e8e8e8;
        font-family: "Inter", sans-serif;
      }

      .genres {
        font-size: 0.8rem;
        color: #888;
        margin-bottom: 0.35rem;
        font-style: italic;
      }

      .location {
        font-size: 0.8rem;
        color: #666;
        margin-bottom: 0.5rem;
        font-style: italic;
      }

      .social-links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 0.5rem;
      }

      .social-links a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        text-decoration: none;
        color: #888;
        transition: color 0.2s ease;
        font-size: 0.9rem;
      }

      .social-links a:hover {
        color: #d0d0d0;
      }

      .si-icon {
        width: 1em;
        height: 1em;
        vertical-align: -0.125em;
        filter: invert(54%);
        transition: filter 0.2s ease;
      }

      .social-links a:hover .si-icon {
        filter: invert(82%);
      }

      .count {
        color: #666;
        font-size: 0.75rem;
        text-align: center;
        margin-bottom: 1rem;
        font-family: "JetBrains Mono", monospace;
      }

      .count span {
        color: #888;
      }

      .nav {
        text-align: center;
        margin-bottom: 1rem;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.8rem;
      }

      .nav a {
        color: #555;
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .nav a:hover {
        color: #999;
      }

      .playlist-bar {
        display: none;
        text-align: center;
        margin-bottom: 1rem;
      }

      .playlist-label {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.75rem;
        color: #555;
        margin-bottom: 0.4rem;
      }

      .playlist-buttons {
        display: inline-flex;
        gap: 0.5rem;
      }

      .playlist-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.35rem 0.75rem;
        background: transparent;
        border: 1px solid #333;
        border-radius: 3px;
        color: #666;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.75rem;
        cursor: pointer;
        transition: border-color 0.2s ease, color 0.2s ease;
      }

      #playlist-btn-spotify:hover:not(:disabled) {
        border-color: #1DB954;
        color: #1DB954;
      }

      #playlist-btn-tidal:hover:not(:disabled) {
        border-color: #3892DB;
        color: #3892DB;
      }

      #playlist-btn-apple-music:hover:not(:disabled) {
        border-color: #fc3c44;
        color: #fc3c44;
      }

      .playlist-btn:disabled {
        cursor: default;
        opacity: 0.5;
      }

      .playlist-status {
        margin-top: 0.5rem;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.75rem;
        color: #555;
        min-height: 1rem;
      }

      .playlist-status a {
        color: #1DB954;
        text-decoration: none;
      }

      .playlist-status a:hover {
        text-decoration: underline;
      }

      .playlist-status.error {
        color: #c04040;
      }

      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 100;
        align-items: center;
        justify-content: center;
      }

      .modal-overlay.active {
        display: flex;
      }

      .modal {
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 4px;
        padding: 1.25rem 1.5rem;
        width: min(400px, 90vw);
      }

      .modal h3 {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.85rem;
        font-weight: 400;
        color: #aaa;
        margin-bottom: 0.75rem;
      }

      .modal input[type="text"] {
        width: 100%;
        font-family: "Inter", sans-serif;
        font-size: 0.9rem;
        padding: 0.5rem 0.75rem;
        background: #0f0f0f;
        border: 1px solid #333;
        border-radius: 3px;
        color: #e0e0e0;
        margin-bottom: 0.75rem;
      }

      .modal input[type="text"]:focus {
        outline: none;
        border-color: #555;
      }

      .modal-coverage {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.7rem;
        color: #555;
        margin-bottom: 0.75rem;
      }

      .modal-coverage.partial {
        color: #7a6030;
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
      }

      .modal-btn {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.75rem;
        padding: 0.35rem 0.75rem;
        background: transparent;
        border: 1px solid #333;
        border-radius: 3px;
        color: #666;
        cursor: pointer;
        transition: border-color 0.2s ease, color 0.2s ease;
      }

      .modal-btn:hover {
        border-color: #666;
        color: #aaa;
      }

      .modal-btn.primary:hover {
        border-color: #1DB954;
        color: #1DB954;
      }

      @media (max-width: 768px) {
        body {
          padding: 1rem 0.75rem;
        }

        h1 {
          font-size: 1.5rem;
        }

        #band-list {
          grid-template-columns: 1fr;
        }

        .filters input {
          min-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Colorado Bands</h1>
      <div class="nav"><a href="venues.html">venues →</a></div>

      <div class="filters">
        <input type="text" id="nameFilter" placeholder="Filter by name..." />
        <input type="text" id="genreFilter" placeholder="Filter by genre..." />
        <input
          type="text"
          id="locationFilter"
          placeholder="Filter by location..."
        />
      </div>

      <div class="count">(filtered count: <span id="count"></span>)</div>

      <div class="playlist-bar" id="playlist-bar">
        <div class="playlist-label">create a playlist from these results:</div>
        <div class="playlist-buttons">
          <button class="playlist-btn" id="playlist-btn-spotify">
            <i class="fa fa-spotify"></i> spotify
          </button>
          <button class="playlist-btn" id="playlist-btn-tidal">
            <i class="fa fa-music"></i> tidal
          </button>
          <button class="playlist-btn" id="playlist-btn-apple-music">
            <i class="fa fa-apple"></i> apple music
          </button>
        </div>
        <div class="playlist-status" id="playlist-status"></div>
      </div>

      <div id="band-list"></div>
    </div>

    <div class="modal-overlay" id="playlist-modal">
      <div class="modal">
        <h3>name your playlist</h3>
        <input type="text" id="playlist-name-input" />
        <div class="modal-coverage" id="modal-coverage"></div>
        <div class="modal-actions">
          <button class="modal-btn" id="modal-cancel">cancel</button>
          <button class="modal-btn primary" id="modal-confirm">create</button>
        </div>
      </div>
    </div>

    <script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js"></script>
    <script src="data.js?v1787246092"></script>
    <script src="spotify.js?v1776135859"></script>
    <script src="tidal.js?v1776135859"></script>
    <script src="apple-music.js?v1776135859"></script>
    <script>
      const nameInput = document.getElementById("nameFilter");
      const genreInput = document.getElementById("genreFilter");
      const locationInput = document.getElementById("locationFilter");
      const container = document.getElementById("band-list");

      function getVisibleBands() {
        const result = [];
        const cards = container.children;
        for (let i = 0; i < cards.length && result.length < 20; i++) {
          if (cards[i].style.display !== 'none') {
            const name = cards[i].dataset.name;
            const band = bands.find(b => b.name.toLowerCase() === name);
            if (band) result.push(band);
          }
        }
        return result;
      }

      function derivePlaylistName() {
        const genre = genreInput.value.trim();
        const location = locationInput.value.trim();
        const name = nameInput.value.trim();
        const cap = s => s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
        if (genre && location) return `${cap(location)} ${cap(genre)}`;
        if (genre) return `Colorado ${cap(genre)}`;
        if (location) return `${cap(location)} Bands`;
        if (name) return `Colorado Bands: ${name}`;
        return 'Colorado Bands Mix';
      }

      function setPlaylistStatus(msg, isError = false) {
        const el = document.getElementById('playlist-status');
        el.innerHTML = msg; // trusted internal HTML only
        el.className = 'playlist-status' + (isError ? ' error' : '');
      }

      let _pendingService = null;

      function countEligibleBands(service, visibleBands) {
        if (service === 'spotify') {
          return visibleBands.filter(b => b.spotify_id).length;
        }
        if (service === 'tidal') {
          return visibleBands.filter(b =>
            (b.links || []).some(l => /tidal\.com\/(?:browse\/)?artist\/\d+/.test(l))
          ).length;
        }
        // apple-music: look for music.apple.com or itunes.apple.com artist links
        return visibleBands.filter(b =>
          (b.links || []).some(l =>
            /music\.apple\.com\/[^/]+\/artist\/\d+/.test(l) ||
            /itunes\.apple\.com\/[^/]+\/artist\/(?:[^/]+\/)?id\d+/.test(l)
          )
        ).length;
      }

      function showPlaylistModal(service) {
        _pendingService = service;
        const input = document.getElementById('playlist-name-input');
        input.value = derivePlaylistName();

        const visible = getVisibleBands();
        const eligible = countEligibleBands(service, visible);
        const coverageEl = document.getElementById('modal-coverage');
        coverageEl.textContent = `${eligible} of ${visible.length} bands have ${service} tracks`;
        coverageEl.className = 'modal-coverage' + (eligible < visible.length ? ' partial' : '');

        document.getElementById('playlist-modal').classList.add('active');
        requestAnimationFrame(() => { input.select(); input.focus(); });
      }

      function hidePlaylistModal() {
        document.getElementById('playlist-modal').classList.remove('active');
        _pendingService = null;
      }

      async function startPlaylistAuth(service, playlistName) {
        // Apple Music uses popup auth — no redirect needed; run inline.
        if (service === 'apple-music') {
          if (!AppleMusic.isConfigured()) {
            setPlaylistStatus('apple music developer token not configured', true);
            return;
          }
          const btn = document.getElementById('playlist-btn-apple-music');
          btn.disabled = true;
          const visibleBands = getVisibleBands();
          setPlaylistStatus(`fetching tracks... (0/${visibleBands.length})`);
          try {
            const { url, skipped } = await AppleMusic.createPlaylistFromBands({
              bands: visibleBands,
              playlistName,
              onProgress: msg => setPlaylistStatus(msg),
            });
            const skipNote = skipped > 0 ? ` (${skipped} not on apple music)` : '';
            setPlaylistStatus(`playlist created${skipNote} · <a href="${url}" target="_blank" rel="noopener">open in apple music →</a>`);
          } catch (err) {
            setPlaylistStatus('error: ' + (err.message || 'something went wrong'), true);
            btn.disabled = false;
          }
          return;
        }

        const adapter = service === 'tidal' ? Tidal : Spotify;
        if (!adapter.isConfigured()) {
          setPlaylistStatus(`${service} client id not configured`, true);
          return;
        }
        sessionStorage.setItem('playlist_name', playlistName);
        await adapter.startAuth({
          name: nameInput.value,
          genre: genreInput.value,
          location: locationInput.value,
        });
      }

      async function handleCallback(code, service) {
        const adapter = service === 'tidal' ? Tidal : Spotify;
        const filters = adapter.getSavedFilters();
        nameInput.value = filters.name;
        genreInput.value = filters.genre;
        locationInput.value = filters.location;

        const playlistName = sessionStorage.getItem('playlist_name') || derivePlaylistName();
        sessionStorage.removeItem('playlist_name');

        filterBands();

        const visibleBands = getVisibleBands();
        if (visibleBands.length === 0) {
          setPlaylistStatus('no matching artists', true);
          return;
        }

        const btnId = service === 'tidal' ? 'playlist-btn-tidal' : 'playlist-btn-spotify';
        const btn = document.getElementById(btnId);
        btn.disabled = true;
        setPlaylistStatus(`fetching tracks... (0/${visibleBands.length})`);

        try {
          const { url, skipped } = await adapter.createPlaylistFromSearch({
            code,
            bands: visibleBands,
            playlistName,
            onProgress: msg => setPlaylistStatus(msg),
          });
          const skipNote = skipped > 0 ? ` (${skipped} not on ${service})` : '';
          setPlaylistStatus(`playlist created${skipNote} · <a href="${url}" target="_blank" rel="noopener">open in ${service} →</a>`);
        } catch (err) {
          setPlaylistStatus('error: ' + (err.message || 'something went wrong'), true);
          btn.disabled = false;
        }
      }

      function updateCount(count) {
        document.getElementById("count").innerText = count;
        const anyFilter = nameInput.value || genreInput.value || locationInput.value;
        const bar = document.getElementById('playlist-bar');
        bar.style.display = (count > 0 && anyFilter) ? 'block' : 'none';
        // reset status/buttons when filter changes (not during OAuth callback)
        if (!new URLSearchParams(window.location.search).get('code')) {
          setPlaylistStatus('');
          document.getElementById('playlist-btn-spotify').disabled = false;
          document.getElementById('playlist-btn-tidal').disabled = false;
          document.getElementById('playlist-btn-apple-music').disabled = false;
        }
      }

      // extract root domain
      function getRootDomain(url) {
        const complexTLDs = [
          "co.uk",
          "org.uk",
          "gov.uk",
          "ac.uk",
          "com.au",
          "net.au",
          "co.jp",
        ];
        const hostname = new URL(url).hostname;
        const parts = hostname.split(".");

        const lastTwo = parts.slice(-2).join(".");
        const lastThree = parts.slice(-3).join(".");

        if (complexTLDs.includes(lastTwo)) {
          return parts.slice(-3).join(".");
        } else if (complexTLDs.includes(lastThree)) {
          return parts.slice(-4).join(".");
        }

        return lastTwo;
      }

      function getIconClassFromUrl(url) {
        const rootDomain = getRootDomain(url);
        const map = {
          "tiktok.com": "fab fa-tiktok",
          "youtube.com": "fa fa-youtube",
          "youtu.be": "fa fa-youtube",
          "facebook.com": "fa fa-facebook-f",
          "instagram.com": "fa fa-instagram",
          "spotify.com": "fa fa-spotify",
          "bandcamp.com": "fa fa-bandcamp",
          "apple.com": "fa fa-apple",
          "amazon.com": "fa fa-amazon",
          "soundcloud.com": "fab fa-soundcloud",
          "last.fm": "fa fa-lastfm",
          "wikidata.org": "fa fa-wikipedia-w",
          "wikipedia.org": "fa fa-wikipedia-w",
          "wikipedia.com": "fa fa-wikipedia-w",
          "twitter.com": "fa fa-x",
          "x.com": "fa fa-x",
          "threads.com": "fab fa-threads",
          "tumblr.com": "fa fa-tumblr",
          "imdb.com": "fa fa-imdb",
          "loc.gov": "fa fa-landmark-dome",
          "tidal.com": "si:tidal",
          "deezer.com": "si:deezer",
          "discogs.com": "fa fa-record-vinyl",
          "rateyourmusic.com": "fa fa-star",
          "allmusic.com": "fa fa-star",
          "metal-archives.com": "fa fa-guitar",
          "songkick.com": "si:songkick",
          "bandsintown.com": "si:bandsintown",
          "setlist.fm": "fa fa-list",
          "twitch.tv": "fab fa-twitch",
          "reverbnation.com": "si:reverbnation",
          "linktr.ee": "fa fa-link",
          "beatport.com": "si:beatport",
          "genius.com": "fa fa-lightbulb",
          "napster.com": "si:napster",
          "qobuz.com": "fa fa-music",
          "patreon.com": "fab fa-patreon",
          "linkedin.com": "fab fa-linkedin",
          "vimeo.com": "fab fa-vimeo-v",
        };
        return map[rootDomain] || "fa fa-globe";
      }

      function slugify(name) {
        return name
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/(^-|-$)/g, "");
      }

      function preRenderBands(data) {
        container.innerHTML = "";
        const fragment = document.createDocumentFragment();
        data.forEach((band) => {
          const bandEl = document.createElement("div");
          bandEl.className = "band";

          // Store searchable data as lowercase attributes for fast filtering
          bandEl.dataset.name = band.name.toLowerCase();
          bandEl.dataset.genres = Array.isArray(band.genres)
            ? band.genres.map((g) => g.toLowerCase()).join("\0")
            : (band.genres || "").toLowerCase();
          bandEl.dataset.location = (band.location || "").toLowerCase();

          const name = document.createElement("h2");
          const nameLink = document.createElement("a");
          nameLink.href = "artist.html?slug=" + encodeURIComponent(slugify(band.name));
          nameLink.textContent = band.name;
          nameLink.style.color = "inherit";
          nameLink.style.textDecoration = "none";
          name.appendChild(nameLink);
          bandEl.appendChild(name);

          const genres = document.createElement("div");
          genres.className = "genres";
          genres.textContent = Array.isArray(band.genres)
            ? band.genres.join(", ")
            : band.genres || "";
          bandEl.appendChild(genres);

          const location = document.createElement("div");
          location.className = "location";
          location.textContent = band.location;
          bandEl.appendChild(location);

          const socialLinks = document.createElement("div");
          socialLinks.className = "social-links";

          band.links.forEach((href) => {
            try {
              const link = document.createElement("a");
              link.href = href;
              link.target = "_blank";
              link.title = href;
              const className = getIconClassFromUrl(href);
              let icon;
              if (className.startsWith("si:")) {
                icon = document.createElement("img");
                icon.src = `https://cdn.simpleicons.org/${className.slice(3)}/000000`;
                icon.className = "si-icon";
              } else {
                icon = document.createElement("i");
                icon.className = className;
              }
              link.appendChild(icon);
              socialLinks.appendChild(link);
            } catch (err) {
              console.log(err);
              return null;
            }
          });
          bandEl.appendChild(socialLinks);

          fragment.appendChild(bandEl);
        });
        container.appendChild(fragment);
      }

      function updateURL() {
        const params = new URLSearchParams();
        if (nameInput.value) {
          params.set("name", nameInput.value);
        }
        if (genreInput.value) {
          params.set("genre", genreInput.value);
        }
        if (locationInput.value) {
          params.set("location", locationInput.value);
        }

        const newURL =
          window.location.pathname +
          (params.toString() ? "?" + params.toString() : "");
        window.history.pushState({}, "", newURL);
      }

      function loadFiltersFromURL() {
        const params = new URLSearchParams(window.location.search);
        const nameParam = params.get("name");
        const genreParam = params.get("genre");
        const locationParam = params.get("location");

        if (nameParam) {
          nameInput.value = nameParam;
        }
        if (genreParam) {
          genreInput.value = genreParam;
        }
        if (locationParam) {
          locationInput.value = locationParam;
        }
      }

      function debounce(fn, delay) {
        let timer;
        return function (...args) {
          clearTimeout(timer);
          timer = setTimeout(() => fn.apply(this, args), delay);
        };
      }

      function filterBands() {
        const nameValue = nameInput.value.toLowerCase();
        const genreValue = genreInput.value.toLowerCase();
        const locationValue = locationInput.value.toLowerCase();

        let count = 0;
        const cards = container.children;
        for (let i = 0; i < cards.length; i++) {
          const card = cards[i];
          const nameMatch = !nameValue || card.dataset.name.includes(nameValue);
          const genreMatch =
            !genreValue ||
            card.dataset.genres.split("\0").some((g) => g.includes(genreValue));
          const locationMatch =
            !locationValue || card.dataset.location.includes(locationValue);
          const visible = nameMatch && genreMatch && locationMatch;
          card.style.display = visible ? "" : "none";
          if (visible) count++;
        }

        updateCount(count);
        updateURL();
      }

      // Pre-render all bands once
      preRenderBands(bands);

      // Playlist button clicks — open modal
      document.getElementById('playlist-btn-spotify').addEventListener('click', () => showPlaylistModal('spotify'));
      document.getElementById('playlist-btn-tidal').addEventListener('click', () => showPlaylistModal('tidal'));
      document.getElementById('playlist-btn-apple-music').addEventListener('click', () => setPlaylistStatus('apple music playlist creation coming soon'));

      // Modal controls
      document.getElementById('modal-cancel').addEventListener('click', hidePlaylistModal);
      document.getElementById('modal-confirm').addEventListener('click', () => {
        const name = document.getElementById('playlist-name-input').value.trim() || derivePlaylistName();
        const service = _pendingService;
        hidePlaylistModal();
        startPlaylistAuth(service, name);
      });
      document.getElementById('playlist-name-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('modal-confirm').click();
        if (e.key === 'Escape') hidePlaylistModal();
      });
      document.getElementById('playlist-modal').addEventListener('click', e => {
        if (e.target === e.currentTarget) hidePlaylistModal();
      });

      // Check for OAuth callback before loading filters from URL
      const _urlParams = new URLSearchParams(window.location.search);
      const _oauthCode = _urlParams.get('code');

      if (_oauthCode) {
        // Returning from a streaming service — route by which service initiated auth
        const _service = sessionStorage.getItem('streaming_service') || 'spotify';
        handleCallback(_oauthCode, _service);
      } else {
        // Normal page load
        loadFiltersFromURL();
        filterBands();
      }

      // Debounced filter for input events; URL update also debounced
      const debouncedFilter = debounce(filterBands, 150);

      nameInput.addEventListener("input", debouncedFilter);
      genreInput.addEventListener("input", debouncedFilter);
      locationInput.addEventListener("input", debouncedFilter);

      // Handle browser back/forward buttons
      window.addEventListener("popstate", () => {
        loadFiltersFromURL();
        filterBands();
      });
    </script>
  </body>
</html>
